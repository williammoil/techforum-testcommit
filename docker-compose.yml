version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-TechForum@2024}
      MYSQL_DATABASE: techforum
    ports:
      - '3306:3306'
    volumes:
      - ./database/sql/core:/docker-entrypoint-initdb.d

  api-gateway:
    build: .
    ports:
      - '3000:3000'
    env_file: .env
    depends_on:
      - mysql

  ai-python:
    build: ./services/ai-python
    ports:
      - '8085:8085'
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8085

  auth-java:
    build: ./services/auth-java
    ports:
      - '8084:8084'
    env_file: .env

  gateway-go:
    build: ./services/gateway-go
    ports:
      - '8081:8081'
    env_file: .env

  shop-dotnet:
    build: ./services/shop-dotnet/TechForum.Shop
    ports:
      - '8082:8082'
    env_file: .env

  media-rust:
    build: ./services/media-rust
    ports:
      - '8083:8083'
    env_file: .env

  legacy-php:
    image: php:8.2-apache
    volumes:
      - ./services/legacy-php/public:/var/www/html
    ports:
      - '8086:80'
    env_file: .env

  forum-ts:
    build: ./services/forum-ts
    ports:
      - '8090:8090'
    env_file: .env

  web:
    build: ./client
    ports:
      - '5173:5173'
